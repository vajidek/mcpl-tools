name: CI
on:
  push:
    branches:
      - main
      - final-product-hardening
      - production-a2z
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Frontend and backend build
        run: npm run build
      - name: Backend type check
        run: npm run backend:check
      - name: Backend MCP smoke test
        run: npm run backend:test-mcp
      - name: Backend Docker build
        run: docker build -t mcpl-tools-api:ci .